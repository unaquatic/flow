name: Release Mirror

run-name: Release Mirror ${{ inputs.tag || github.event.release.tag_name }}

# Release Mirror copies the GitHub release of a version tag, vX.Y.Z, to the
# R2 bucket flow-releases, which aquatic.dev serves at /flow/releases/: the
# flow binary of every platform, once its release attestation verifies it,
# as flow/vX.Y.Z/flow-OS-ARCH.tar.gz, then flow/vX.Y.Z/SHA256SUMS of them,
# which marks the version as mirrored whole, and, when the tag is GitHub's
# latest release, flow/latest, which holds the tag. ci-tag.yml calls it once
# the release is out. A version mirrored before is left as it is, but its
# notes, flow/vX.Y.Z/notes.md, and flow/vX.Y.Z/release.json, its date, page
# and files, which aquatic.dev's releases page reads, are
# copied again on every run, which an edit of a published release on GitHub
# starts too.
#
# It needs the secrets CLOUDFLARE_R2_TOKEN, an API token that may edit the
# bucket's objects, and CLOUDFLARE_ACCOUNT_ID.
on:
  release:
    types: [edited]

  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to mirror, vX.Y.Z"
        type: string
        required: true

  workflow_call:
    inputs:
      tag:
        description: "Version tag to mirror, vX.Y.Z"
        type: string
        required: true

concurrency:
  group: release-mirror
  cancel-in-progress: false

permissions:
  attestations: read
  contents: read

jobs:
  mirror:
    name: Release Mirror
    # A draft is not mirrored until it is published.
    if: github.event_name != 'release' || !github.event.release.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is no version vX.Y.Z" >&2
            exit 1
          fi
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!key}" ] || { echo "missing secret $key" >&2; exit 1; }
          done
          npm install --global --no-fund --no-audit wrangler@4 >/dev/null
          bucket=flow-releases
          immutable='public, max-age=31536000, immutable'

          if wrangler r2 object get "$bucket/flow/$TAG/SHA256SUMS" --remote --pipe > "$RUNNER_TEMP/sums" 2>/dev/null \
            && grep -q 'flow-' "$RUNNER_TEMP/sums"; then
            echo "$TAG is mirrored already"
          else
            assets=$RUNNER_TEMP/assets
            gh release download "$TAG" --repo "$REPO" --pattern 'flow-*.tar.gz' --dir "$assets"
            for asset in "$assets"/*; do
              gh release verify-asset "$TAG" "$asset" --repo "$REPO"
            done
            (cd "$assets" && sha256sum flow-*.tar.gz > "$RUNNER_TEMP/SHA256SUMS")
            for asset in "$assets"/flow-*.tar.gz; do
              wrangler r2 object put "$bucket/flow/$TAG/$(basename "$asset")" --remote --file "$asset" \
                --content-type application/gzip --cache-control "$immutable"
            done
            wrangler r2 object put "$bucket/flow/$TAG/SHA256SUMS" --remote --file "$RUNNER_TEMP/SHA256SUMS" \
              --content-type 'text/plain; charset=utf-8' --cache-control "$immutable"
          fi

          # release.json and the notes follow every edit, so they are not
          # cached for long.
          gh release view "$TAG" --repo "$REPO" --json tagName,publishedAt,url,assets > "$RUNNER_TEMP/github.json"
          sums=$RUNNER_TEMP/SHA256SUMS
          [ -f "$sums" ] || sums=$RUNNER_TEMP/sums
          jq --rawfile sums "$sums" '
            ($sums | split("\n") | map(select(. != "") | split("  ") | {key: .[1], value: .[0]}) | from_entries) as $sha
            | {tag: .tagName, published_at: .publishedAt, url,
               assets: [.assets[] | select(.name | test("^flow-.*[.](tar[.]gz|zip)$")) | {name, size, sha256: $sha[.name]}]}
          ' "$RUNNER_TEMP/github.json" > "$RUNNER_TEMP/release.json"
          wrangler r2 object put "$bucket/flow/$TAG/release.json" --remote --file "$RUNNER_TEMP/release.json" \
            --content-type 'application/json; charset=utf-8' --cache-control 'public, max-age=300'
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          wrangler r2 object put "$bucket/flow/$TAG/notes.md" --remote --file "$RUNNER_TEMP/notes.md" \
            --content-type 'text/markdown; charset=utf-8' --cache-control 'public, max-age=300'

          # latest follows GitHub's latest release, so that mirroring an older
          # version again never takes it back.
          latest=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          if [ "$latest" = "$TAG" ]; then
            printf '%s\n' "$TAG" > "$RUNNER_TEMP/latest"
            wrangler r2 object put "$bucket/flow/latest" --remote --file "$RUNNER_TEMP/latest" \
              --content-type 'text/plain; charset=utf-8' --cache-control 'public, max-age=300'
          else
            echo "the latest release is $latest, not $TAG: flow/latest is left as it is"
          fi
